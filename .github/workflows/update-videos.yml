name: Update latest videos

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch newest uploads
        env:
          YT_HANDLE: EthanSurnameYT
          MAX_VIDEOS: 6
        run: node scripts/update-videos.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet videos.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Update latest videos"
          git push
